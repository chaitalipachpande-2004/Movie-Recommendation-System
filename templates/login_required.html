<!DOCTYPE html><html>
<head>
    <title>Login Required</title><style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        background:#111;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .box{
        background:#1b1b1b;
        border:2px solid gold;
        border-radius:15px;
        padding:40px;
        text-align:center;
        width:500px;
    }

    h2{
        color:gold;
        margin-bottom:20px;
    }

    p{
        color:#ccc;
        margin-bottom:25px;
        line-height:1.6;
    }

    a{
        display:inline-block;
        background:gold;
        color:black;
        text-decoration:none;
        padding:12px 25px;
        border-radius:8px;
        font-weight:bold;
    }

    a:hover{
        background:#ffd700;
    }

</style>

</head><body><div class="box">

    <h2>🔒 Login Required</h2>

    <p>
        Please login to view movie recommendations,
        save recommendation history and access your profile.
    </p>

    <a href="/login">
        Login Now
    </a>

</div>

</body>
</html>
