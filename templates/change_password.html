<!DOCTYPE html><html>
<head>
    <title>Change Password</title><style>

    body{
        background:#111;
        font-family:Arial,sans-serif;
        color:white;
    }

    .container{
        width:400px;
        margin:80px auto;
        background:#1b1b1b;
        padding:30px;
        border-radius:15px;
        border:2px solid gold;
    }

    h2{
        text-align:center;
        color:gold;
        margin-bottom:25px;
    }

    input{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border:none;
        border-radius:8px;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:12px;
        background:gold;
        color:black;
        border:none;
        border-radius:8px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#ffd700;
    }

    .back{
        text-align:center;
        margin-top:20px;
    }

    .back a{
        color:gold;
        text-decoration:none;
    }
    .password-box{
    position:relative;
    margin-bottom:15px;
    }

    .password-box input{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
    }

    .password-box span{
        position:absolute;
        right:15px;
        top:12px;
        cursor:pointer;
    }

    @media (max-width:768px)
    {

        .form-container{
            width:95%;
        }

    }

</style>

</head><body><div class="container">

    <h2>🔒 Change Password</h2>

    <form action="/update_password" method="POST">

        <div class="password-box">
            <input type="password" id="old_password"
                name="old_password"
                placeholder="Enter Current Password"
                required>

            <span onclick="togglePassword('old_password')">👁️</span>
        </div>

        <div class="password-box">
            <input type="password" id="new_password"
                name="new_password"
                placeholder="Enter New Password"
                required>

            <span onclick="togglePassword('new_password')">👁️</span>
        </div>

        <div class="password-box">
            <input type="password" id="confirm_password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required>

            <span onclick="togglePassword('confirm_password')">👁️</span>
        </div>

        <button type="submit">
            Update Password
        </button>

    </form>

    <div class="back">

        <a href="/profile">
            ← Back To Profile
        </a>

    </div>

</div>

<script>

function togglePassword(id){

    let field = document.getElementById(id);

    if(field.type === "password"){
        field.type = "text";
    }
    else{
        field.type = "password";
    }

}

</script>

</body>
</html>
