<!DOCTYPE html>
<html>
<head>
    <title>History</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
        }

        h1{
            text-align:center;
            color:gold;
            margin-top:30px;
        }

        table{
            width:90%;
            margin:30px auto;
            border-collapse:collapse;
            background:#1b1b1b;
        }

        th{
            background:gold;
            color:black;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border:1px solid #333;
        }

        tr:hover{
            background:#222;
        }

        .back{
            text-align:center;
            margin-top:30px;
        }

        .back a{
            background:gold;
            color:black;
            text-decoration:none;
            padding:10px 20px;
            border-radius:8px;
        }

        @media (max-width:768px)
        {

            table{
                display:block;
                overflow-x:auto;
            }

        }


       
    </style>

</head>

<body>

    <!-- <div class="navbar">
        <div class="logo">
            🎬 Movie Recommender
        </div>

        <div class="nav-links">
            <a href="/">🏠 Home</a>
            <a href="/profile">👤 Profile</a>
            <a href="/history">📜 History</a>
            <a href="/logout">🚪 Logout</a>
        </div>

    </div> -->

    <!--navbar code added-->
    {% include 'navbar.html' %}

    <h1>📜 Recommendation History</h1>

    <p style="text-align: center;color: #ccc;">
        total searches: {{ history_data|length }}
    </p>

    <table>

        <tr>
            <th>Movie Name</th>
            <th>Method</th>
            <th>Recommendations</th>
            <th>Date</th>
        </tr>

        {% for row in history_data %}

        <tr>

            <td>{{ row[0] }}</td>

            <td>{{ row[1] }}</td>

            <td style="max-width: 300px;">
                {{ row[2] }}
            </td>

            <td>{{ row[3] }}</td>

        </tr>

        {% endfor %}

    </table>

    <div class="back">

        <a href="/">
            Back To Home
        </a>

    </div>

    <!--adding footer-->
    {% include 'footer.html' %}

</body>
</html>
